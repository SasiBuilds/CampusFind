<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusFind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CampusFind</h1>
    <div class="auth-buttons">
      <button class="login">Login</button>
      <button class="register">Register</button>
    </div>
  </header>

  <div class="hero">
    <h2>FOR COLLEGE STUDENTS ONLY</h2>
    <p>
      Lost something on campus? We’ll help you find it.<br>
      The fastest way to reunite students with their lost belongings.<br>
      Post, search, and connect — all in one place.
    </p>

    <div class="buttons">
      <button class="lost" onclick="postLost()">Post Lost Item</button>
      <button class="found" onclick="postFound()">Post Found Item</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search for lost or found items... e.g. 'blue backpack'">
      <button onclick="searchItems()">Search</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
